# =============================================================================
# PAGER-Chain agent registry: the gate agent pool in Paper 1's Agent format
#
# Transcribed from the frozen gate/agents/gate_agents.yaml. id, capabilities,
# hipaa_compliant and cost_per_query must match it exactly (checked by
# tests/chain/test_registry_config.py). The other Agent fields are fixed, neutral
# values shared by every agent. They do not affect the cost-aware strategy. Under
# the latency- or quality-aware strategies every agent ties, so Paper 1's tie rule
# (agent id) decides; those strategies are not meaningful on this pool until real
# latency and quality figures exist.
# Roles are empty, so Paper 1's role policy imposes no constraint.
# =============================================================================

capabilities:
  ehr.patient_lookup: {record_access: read}
  ehr.read_observation: {record_access: read}
  ehr.write_observation: {record_access: write}
  ehr.read_document: {record_access: read}
  ehr.order_medication: {record_access: write}
  ehr.order_lab: {record_access: write}
  ehr.order_referral: {record_access: write}
  text.summarize: {record_access: none}
  text.deidentify: {record_access: none, declassifier: true}
  text.translate: {record_access: none}
  knowledge.answer: {record_access: none}

agents:
  - id: ehr_patient
    name: "EHR Patient"
    capabilities: ["ehr.patient_lookup"]
    hipaa_compliant: true
    gdpr_compliant: false
    authorized_roles: []
    data_access_level: 2
    cost_per_query: 0.01
    avg_latency_ms: 100.0
    quality_score: 0.80
    endpoint: "mock://ehr_patient"
    max_concurrent: 100

  - id: ehr_patient_lite
    name: "EHR Patient Lite"
    capabilities: ["ehr.patient_lookup"]
    hipaa_compliant: false
    gdpr_compliant: false
    authorized_roles: []
    data_access_level: 2
