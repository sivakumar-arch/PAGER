# =============================================================================
# PAGER: Healthcare Agent Registry
# 5 FHIR-based agents matching MedAgentBench task types
#
# Costs, latencies, and quality scores match paper Section 5.2 exactly.
# Quality scores are on [0,1] scale (paper shows 0-10 for readability;
# footnote documents the normalization: implementation_score = paper_score / 10)
# =============================================================================

agents:
  - id: patient_demographics_agent
    name: "Patient Demographics Agent"
    capabilities:
      - "GET /Patient"
      - "patient_lookup"
      - "demographics_retrieval"
    hipaa_compliant: true
    gdpr_compliant: false
    authorized_roles:
      - nurse
      - doctor
      - admin
      - receptionist
    data_access_level: 2  # 1=public, 2=clinical, 3=restricted
    cost_per_query: 0.01   # paper: $0.01/query
    avg_latency_ms: 50.0   # paper: 50ms
    quality_score: 0.80    # paper: 8.0/10
    endpoint: "mock://patient_demographics"
    max_concurrent: 100

  - id: vitals_agent
    name: "Vitals Agent"
    capabilities:
      - "POST /Observation"
      - "vital_signs"
      - "blood_pressure"
      - "heart_rate"
    hipaa_compliant: true
    gdpr_compliant: false
    authorized_roles:
      - nurse
      - doctor
      - medical_assistant
    data_access_level: 2
    cost_per_query: 0.03   # paper: $0.03/query
    avg_latency_ms: 80.0   # paper: 80ms
    quality_score: 0.82    # paper: 8.2/10
    endpoint: "mock://vitals"
    max_concurrent: 80

  - id: labs_agent
    name: "Labs Agent"
    capabilities:
      - "GET /Observation"
      - "POST /Observation"
      - "lab_results"
      - "diagnostic_data"
      - "lab_values"
    hipaa_compliant: true
    gdpr_compliant: false
    authorized_roles:
      - nurse
      - doctor
      - lab_tech
    data_access_level: 3
    cost_per_query: 0.05   # paper: $0.05/query
    avg_latency_ms: 100.0  # paper: 100ms
    quality_score: 0.85    # paper: 8.5/10
    endpoint: "mock://labs"
    max_concurrent: 60

  - id: medication_agent
    name: "Medication Agent"
    capabilities:
      - "GET /MedicationRequest"
      - "POST /MedicationRequest"
      - "medication_ordering"
      - "prescription_management"
    hipaa_compliant: true
    gdpr_compliant: false
    authorized_roles:
      - doctor
      - pharmacist
    data_access_level: 3
    cost_per_query: 0.06   # paper: $0.06/query
    avg_latency_ms: 120.0  # paper: 120ms
    quality_score: 0.88    # paper: 8.8/10
    endpoint: "mock://medication"
    max_concurrent: 50

  - id: procedure_agent
    name: "Procedure Agent"
    capabilities:
      - "GET /Procedure"
      - "POST /ServiceRequest"
      - "procedure_ordering"
      - "referral_management"
      - "surgery_scheduling"
    hipaa_compliant: true
    gdpr_compliant: false
    authorized_roles:
      - doctor
      - surgeon
    data_access_level: 3
    cost_per_query: 0.08   # paper: $0.08/query
    avg_latency_ms: 150.0  # paper: 150ms
    quality_score: 0.90    # paper: 9.0/10
    endpoint: "mock://procedure"
    max_concurrent: 40
